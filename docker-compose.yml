services:
  postgres:
    image: postgres:16
    container_name: llm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: llm_user
      POSTGRES_PASSWORD: strongpassword
      POSTGRES_DB: llm_travel
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: llm-travel-api
    depends_on:
      - postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://llm_user:strongpassword@postgres:5432/llm_travel
      OLLAMA_BASE_URL: http://192.168.0.17:11434
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:latest
    container_name: llm-travel-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    depends_on:
      - api
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: llm-travel-grafana
    restart: unless-stopped
    profiles: ["monitoring"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
