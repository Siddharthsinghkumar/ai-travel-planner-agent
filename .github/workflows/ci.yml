name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TESTING: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pip-audit

      - name: Python Dependency Audit Gate
        run: |
          pip-audit -r requirements.txt -r requirements-dev.txt

      - name: Frontend Dependency Install
        run: |
          cd frontend
          npm ci

      - name: Frontend Dependency Audit Gate
        run: |
          cd frontend
          npm audit --audit-level=moderate

      - name: Run tests
        env:
          OLLAMA_BASE_URL: http://localhost:11434
          SERPAPI_KEY_1: dummy
          WEATHER_KEY_1: dummy
          OPENAI_KEY_1: dummy
          # Backward-compatible dummy vars for any legacy compatibility checks.
          SERPAPI_KEY: dummy
          WEATHER_API_KEY: dummy
          OPENAI_API_KEY: dummy
          CLOUD_PROVIDER: openai
        run: pytest -q

  docker-build-and-push:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build, Load and Push Image (amd64 only)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/llm-travel-agent:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/llm-travel-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner (local image)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/llm-travel-agent:latest
          format: table
          output: trivy-image-scan.txt
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library

      - name: Upload Trivy scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-scan
          path: trivy-image-scan.txt
          retention-days: 14
